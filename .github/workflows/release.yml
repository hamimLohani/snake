name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Run Tests
        run: go test -v -race -cover ./...

      - name: Build Cross-Platform Release Binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${TAG#v} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/snake-linux-amd64 ./cmd/snake
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/snake-linux-arm64 ./cmd/snake

          # macOS (Darwin)
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/snake-darwin-arm64 ./cmd/snake
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/snake-darwin-amd64 ./cmd/snake

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/snake-windows-amd64.exe ./cmd/snake

          # Archives
          cd dist
          tar -czf "snake-${TAG}-linux-amd64.tar.gz" snake-linux-amd64
          tar -czf "snake-${TAG}-linux-arm64.tar.gz" snake-linux-arm64
          tar -czf "snake-${TAG}-darwin-arm64.tar.gz" snake-darwin-arm64
          tar -czf "snake-${TAG}-darwin-amd64.tar.gz" snake-darwin-amd64
          zip "snake-${TAG}-windows-amd64.zip" snake-windows-amd64.exe

          sha256sum * > checksums.txt
          ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/* || gh release upload "$TAG" dist/* --clobber
